spring.application.name=zidio

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/zidio_db
spring.datasource.username=root
spring.datasource.password=Navi1026@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=always


spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

jwt.secret=zidio_secret
jwt.expiration=86400000

#Emailservice:

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Claudinary in cluadinary we can upload 256 files for free...

cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

#fileUpload  # Maximum file size (example: 10MB)
spring.servlet.multipart.max-file-size=10MB

# Maximum request size (example: 10MB)
spring.servlet.multipart.max-request-size=10MB

# Enable multipart uploads
spring.servlet.multipart.enabled=true

# Where uploaded files will be stored locally
file.upload-dir=uploads

